<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta name="theme-color" content="#0a0a0a" />
    <title>Hors connexion · MyFrigo</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 32px;
        background: #0a0a0a;
        color: #f5f5f5;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        text-align: center;
      }
      main {
        max-width: 340px;
      }
      .icon {
        font-size: 52px;
      }
      h1 {
        margin: 20px 0 8px;
        font-size: 24px;
      }
      p {
        margin: 0;
        color: #a3a3a3;
        line-height: 1.5;
      }
      button {
        margin-top: 24px;
        border: 0;
        border-radius: 14px;
        padding: 13px 20px;
        background: #34d399;
        color: #052e24;
        font: inherit;
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="icon">📡</div>
      <h1>Pas de réseau</h1>
      <p>
        MyFrigo a besoin d’une connexion pour afficher un inventaire à jour et enregistrer tes
        actions.
      </p>
      <button type="button" onclick="location.reload()">Réessayer</button>
    </main>
  </body>
</html>
